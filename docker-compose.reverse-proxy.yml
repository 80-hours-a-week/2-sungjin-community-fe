services:
  backend:
    build:
      context: ../2-sungjin-community-be
      dockerfile: Dockerfile
    container_name: community-backend
    environment:
      DATABASE_URL: sqlite:///./data/community.db
      CORS_ALLOW_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:3001,http://127.0.0.1:3001
    command: >
      /bin/sh -c "mkdir -p /app/data && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: community-frontend
    environment:
      PORT: 3001
      API_URL: http://localhost:8080/api
      FILE_UPLOAD_API_URL: ${FILE_UPLOAD_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3001"

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: community-reverse-proxy
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./ops/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend_data:
