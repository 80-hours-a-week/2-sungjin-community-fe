<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 수정 - 아무 말 대잔치</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>
    <header class="header">
        <div class="header-container">
            <a href="/posts" class="header-logo">
                <h1>아무 말 대잔치</h1>
            </a>
            <div class="header-right dropdown-wrapper">
                <button id="btnMenu" class="btn-profile">
                    <img id="headerProfileImage" src="/images/default-profile.png" alt="프로필" class="profile-image">
                </button>
                <div id="dropdownMenu" class="dropdown-menu">
                    <button data-navigate="/messages">1:1 메시지</button>
                    <button data-navigate="/profile/edit">회원정보수정</button>
                    <button data-navigate="/password/change">비밀번호수정</button>
                    <button data-logout="true">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-header">
                <h2 class="page-title">비밀번호 수정</h2>
            </div>

            <form id="passwordChangeForm" class="auth-form">
                <div class="form-group">
                    <label for="currentPassword">현재 비밀번호</label>
                    <input type="password" id="currentPassword" class="form-input" placeholder="현재 비밀번호를 입력해 주세요" required>
                    <span class="form-error" id="currentPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="newPassword">새 비밀번호</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="새 비밀번호를 입력해 주세요" required>
                    <span class="form-helper" id="passwordHelper"></span>
                    <span class="form-error" id="newPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">새 비밀번호 확인</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="새 비밀번호를 다시 입력해 주세요" required>
                    <span class="form-helper" id="confirmHelper"></span>
                    <span class="form-error" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">수정하기</button>
            </form>
        </div>
    </main>

    <script src="/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/profile/password.js"></script>
</body>

</html>
