<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 수정 - 아무 말 대잔치</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header-container">
            <a href="/posts" class="header-logo">
                <h1>아무 말 대잔치</h1>
            </a>
            <div class="header-right">
                <button id="btnMenu" class="btn-profile">
                    <img id="headerProfileImage" src="/images/default-profile.png" alt="프로필" class="profile-image">
                </button>
                <div id="dropdownMenu" class="dropdown-menu">
                    <a href="/profile/edit" class="dropdown-item">회원정보수정</a>
                    <a href="/profile/password" class="dropdown-item">비밀번호수정</a>
                    <button id="btnLogout" class="dropdown-item">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-header">
                <h2 class="page-title">비밀번호 수정</h2>
            </div>

            <form id="passwordChangeForm" class="auth-form">
                <!-- 현재 비밀번호 -->
                <div class="form-group">
                    <label for="currentPassword">현재 비밀번호*</label>
                    <input 
                        type="password" 
                        id="currentPassword" 
                        class="form-input"
                        placeholder="현재 비밀번호를 입력하세요"
                        required
                    >
                    <span class="form-error" id="currentPasswordError"></span>
                </div>

                <!-- 새 비밀번호 -->
                <div class="form-group">
                    <label for="newPassword">새 비밀번호*</label>
                    <input 
                        type="password" 
                        id="newPassword" 
                        class="form-input"
                        placeholder="새 비밀번호를 입력하세요"
                        required
                    >
                    <span class="form-error" id="newPasswordError"></span>
                    <p class="helper-text">* 8-20자, 대소문자, 숫자, 특수문자 각 1개 이상 포함</p>
                </div>

                <!-- 새 비밀번호 확인 -->
                <div class="form-group">
                    <label for="confirmPassword">새 비밀번호 확인*</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        class="form-input"
                        placeholder="새 비밀번호를 다시 입력하세요"
                        required
                    >
                    <span class="form-error" id="confirmPasswordError"></span>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">수정하기</button>
            </form>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/profile/password.js"></script>
</body>
</html>
