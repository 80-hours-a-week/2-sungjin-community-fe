<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 아무 말 대잔치</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
    <style>
        /* ✅ 커스텀 모달 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal-content p {
            font-size: 16px;
            margin-bottom: 24px;
            color: #333;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-modal {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #7F6AEE;
            color: white;
        }

        .btn-modal:hover {
            background: #6B5BD6;
        }
    </style>
</head>

<body>
    <!-- 헤더 -->
    <header class="header-simple">
        <div class="header-container">
            <button class="btn-back" data-history-back="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
            <h1 class="header-title">아무 말 대잔치</h1>
            <div class="header-spacer"></div>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-header">
                <h2 class="page-title">회원가입</h2>
            </div>

            <form id="signupForm" class="auth-form">
                <!-- 프로필 이미지 -->
                <div class="profile-upload">
                    <span class="profile-label">프로필 사진*</span>
                    <div class="profile-preview" id="profilePreview">
                        <div class="profile-placeholder">+</div>
                    </div>
                    <input type="file" id="profileImage" accept="image/*" style="display: none;">
                    <span class="form-error" id="profileError">프로필 사진을 추가해주세요</span>
                </div>

                <!-- 이메일 -->
                <div class="form-group">
                    <label for="email">이메일*</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="이메일을 입력하세요" required>
                    <button type="button" class="btn-helper" id="btnCheckEmail">중복확인</button>
                    <span class="form-helper" id="emailHelper">@ 포함해서 입력해주세요</span>
                    <span class="form-error" id="emailError"></span>
                </div>

                <!-- 비밀번호 -->
                <div class="form-group">
                    <label for="password">비밀번호*</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="비밀번호를 입력하세요"
                        required>
                    <span class="form-helper" id="passwordHelper">8자 이상 입력해주세요</span>
                    <span class="form-error" id="passwordError"></span>
                </div>

                <!-- 비밀번호 확인 -->
                <div class="form-group">
                    <label for="passwordConfirm">비밀번호 확인*</label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" class="form-input"
                        placeholder="비밀번호를 한번 더 입력하세요" required>
                    <span class="form-error" id="passwordConfirmError"></span>
                </div>

                <!-- 닉네임 -->
                <div class="form-group">
                    <label for="nickname">닉네임*</label>
                    <input type="text" id="nickname" name="nickname" class="form-input" placeholder="닉네임을 입력하세요"
                        maxlength="10" required>
                    <span class="form-helper" id="nicknameHelper">닉네임은 최대 10자 까지 작성 가능합니다.</span>
                    <span class="form-error" id="nicknameError"></span>
                </div>

                <button type="submit" class="btn-submit">회원가입</button>
            </form>

            <div class="auth-footer">
                <a href="/login" class="link-secondary">로그인하러 가기</a>
            </div>
        </div>
    </main>

    <!-- ✅ 커스텀 모달 (dialog 대체) -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-content">
            <p id="modalMessage">회원가입이 완료되었습니다!</p>
            <div class="modal-buttons">
                <button class="btn-modal" id="btnCloseModal">확인</button>
            </div>
        </div>
    </div>

    <script src="/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/auth/signup.js"></script>
</body>

</html>
