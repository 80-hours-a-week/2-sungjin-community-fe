<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알림 센터 - 아무 말 대잔치</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/notifications.css">
    <link rel="manifest" href="/manifest.json">
</head>

<body>
    <div id="headerSlot" data-title="알림 센터" data-back-target="/posts"></div>

    <main class="notifications-main">
        <section class="notifications-shell">
            <header class="notifications-toolbar">
                <div>
                    <h2>최근 활동 알림</h2>
                    <p>좋아요, 댓글, 답글, 1:1 메시지 이벤트를 한 곳에서 확인합니다.</p>
                </div>
                <button id="btnReadAllNotifications" type="button" class="btn-secondary-action">모두 읽음 처리</button>
            </header>

            <div id="notificationsList" class="notifications-list">
                <div class="empty-state">알림을 불러오는 중입니다.</div>
            </div>
        </section>
    </main>

    <script src="/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/notifications.js"></script>
</body>

</html>
