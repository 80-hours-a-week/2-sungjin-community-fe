<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 목록 - 아무 말 대잔치</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/posts.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header-simple">
        <div class="header-container">
            <button class="btn-back" onclick="navigateTo('/')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <h1 class="header-title">아무 말 대잔치</h1>
            <button class="btn-menu" id="btnMenu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                </svg>
                <div class="dropdown-menu" id="dropdownMenu">
                    <button onclick="navigateTo('/profile/edit')">회원정보수정</button>
                    <button onclick="navigateTo('/password/change')">비밀번호수정</button>
                    <button onclick="handleLogout()">로그아웃</button>
                </div>
            </button>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="posts-main">
        <div class="posts-container">
            <div class="posts-header">
                <p class="posts-info">아무 말 대잔치에서 자유롭게 이야기를 나눠보세요</p>
                <button class="btn-write" onclick="navigateTo('/posts/write')">
                    게시글 작성
                </button>
            </div>

            <!-- 게시글 리스트 -->
            <div id="postsList" class="posts-list">
                <!-- 게시글이 동적으로 추가됩니다 -->
                <div class="loading">게시글을 불러오는 중...</div>
            </div>

            <!-- 페이지네이션 -->
            <div id="pagination" class="pagination">
                <!-- 페이지네이션 버튼이 동적으로 추가됩니다 -->
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/posts/list.js"></script>
</body>
</html>
