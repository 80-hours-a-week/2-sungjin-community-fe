<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 목록 - 아무 말 대잔치</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/posts.css">
</head>

<body>
    <header class="header-simple">
        <div class="header-container">
            <button class="btn-back" data-navigate="/">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
            <h1 class="header-title">아무 말 대잔치</h1>
            <div class="dropdown-wrapper">
                <button class="btn-menu" id="btnMenu">
                    <img
                        id="headerProfileImage"
                        src="/images/default-profile.png"
                        alt="프로필"
                        class="header-profile-img"
                        style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;"
                    >
                </button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <button data-navigate="/messages">1:1 메시지</button>
                    <button data-navigate="/profile/edit">회원정보수정</button>
                    <button data-navigate="/password/change">비밀번호수정</button>
                    <button data-logout="true" id="btnLogout">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <main class="posts-main">
        <div class="posts-container">
            <div class="posts-header">
                <p class="posts-info">안녕하세요.<br>아무 말 대잔치 <strong>게시판</strong>입니다.</p>
                <button class="btn-write" data-navigate="/posts/write">게시글 작성</button>
            </div>

            <section class="feed-toolbar">
                <div class="sort-tabs" aria-label="피드 정렬">
                    <button type="button" class="sort-tab active" data-sort="latest">최신순</button>
                    <button type="button" class="sort-tab" data-sort="hot">인기순</button>
                    <button type="button" class="sort-tab" data-sort="discussed">댓글순</button>
                </div>
                <div class="tag-filter">
                    <input
                        type="text"
                        id="tagFilterInput"
                        class="tag-filter-input"
                        placeholder="태그로 필터링 (예: react)"
                    >
                    <button type="button" id="btnApplyTag" class="btn-filter">적용</button>
                    <button type="button" id="btnClearTag" class="btn-filter secondary">초기화</button>
                </div>
            </section>

            <div class="posts-layout">
                <section class="posts-section">
                    <div id="postsList" class="posts-list">
                        <div class="loading">게시글을 불러오는 중...</div>
                    </div>
                </section>

                <aside class="trending-panel">
                    <h2>트렌딩</h2>
                    <p class="trending-desc">최근 7일 기준으로 많이 반응한 게시글과 태그입니다.</p>

                    <h3>태그</h3>
                    <div id="trendingTagsList" class="trending-tags-list">
                        <span class="loading">태그를 불러오는 중...</span>
                    </div>

                    <h3>게시글</h3>
                    <div id="trendingPostsList" class="trending-posts-list">
                        <div class="loading">트렌딩을 불러오는 중...</div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <script src="/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/posts/list.js"></script>
</body>

</html>
