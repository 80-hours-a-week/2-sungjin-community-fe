<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원정보 수정 - 아무 말 대잔치</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header-container">
            <a href="/posts" class="header-logo">
                <h1>아무 말 대잔치</h1>
            </a>
            <div class="header-right">
                <button id="btnMenu" class="btn-profile">
                    <img id="headerProfileImage" src="/images/default-profile.png" alt="프로필" class="profile-image">
                </button>
                <div id="dropdownMenu" class="dropdown-menu">
                    <a href="/profile/edit" class="dropdown-item">회원정보수정</a>
                    <a href="/profile/password" class="dropdown-item">비밀번호수정</a>
                    <button id="btnLogout" class="dropdown-item">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 콘텐츠 -->
    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-header">
                <h2 class="page-title">회원정보 수정</h2>
            </div>

            <form id="profileEditForm" class="auth-form">
                <!-- 프로필 이미지 -->
                <div class="form-group">
                    <label>프로필 사진</label>
                    <div class="profile-upload">
                        <div class="profile-preview" id="profilePreview">
                            <img id="previewImage" src="/images/default-profile.png" alt="프로필 미리보기">
                        </div>
                        <input 
                            type="file" 
                            id="profileImage" 
                            accept="image/*"
                            style="display: none;"
                        >
                        <button type="button" class="btn-upload" id="btnSelectImage">
                            이미지 선택
                        </button>
                        <p class="helper-text">JPG, PNG, GIF 파일 (최대 5MB)</p>
                    </div>
                </div>

                <!-- 이메일 (읽기 전용) -->
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input"
                        readonly
                        style="background-color: #f5f5f5; cursor: not-allowed;"
                    >
                </div>

                <!-- 닉네임 -->
                <div class="form-group">
                    <label for="nickname">닉네임*</label>
                    <input 
                        type="text" 
                        id="nickname" 
                        class="form-input"
                        placeholder="닉네임을 입력하세요"
                        maxlength="20"
                        required
                    >
                    <span class="form-error" id="nicknameError"></span>
                    <p class="helper-text">* 2-20자 이내로 입력해주세요</p>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">수정하기</button>
            </form>

            <div class="auth-footer">
                <button id="btnWithdraw" class="link-secondary" style="color: #dc3545; border: none; background: none; cursor: pointer;">
                    회원탈퇴
                </button>
            </div>
        </div>
    </main>

    <!-- 회원탈퇴 확인 모달 -->
    <dialog id="withdrawModal" class="modal">
        <div class="modal-content">
            <h3>회원탈퇴</h3>
            <p>정말로 탈퇴하시겠습니까?</p>
            <p style="color: #dc3545; font-size: 14px; margin-top: 10px;">
                탈퇴 시 모든 데이터가 삭제되며 복구할 수 없습니다.
            </p>
            <div class="modal-actions">
                <button id="btnCancelWithdraw" class="btn-cancel">취소</button>
                <button id="btnConfirmWithdraw" class="btn-danger">탈퇴하기</button>
            </div>
        </div>
    </dialog>

    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/profile/edit.js"></script>
</body>
</html>
