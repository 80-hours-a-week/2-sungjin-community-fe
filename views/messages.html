<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1:1 메시지 - 아무 말 대잔치</title>
    <link rel="stylesheet" href="/css/design-system.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/messages.css">
</head>

<body>
    <header class="header-simple">
        <div class="header-container">
            <button class="btn-back" data-navigate="/posts">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
            <h1 class="header-title">1:1 메시지</h1>
            <div class="dropdown-wrapper">
                <button class="btn-menu" id="btnMenu">
                    <img
                        id="headerProfileImage"
                        src="/images/default-profile.png"
                        alt="프로필"
                        class="header-profile-img"
                    >
                </button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <button data-navigate="/messages">1:1 메시지</button>
                    <button data-navigate="/profile/edit">회원정보수정</button>
                    <button data-navigate="/password/change">비밀번호수정</button>
                    <button data-logout="true">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <main class="messages-main">
        <div class="messages-shell">
            <aside class="messages-sidebar">
                <section class="messages-panel">
                    <div class="panel-header">
                        <h2>사용자 검색</h2>
                        <p>닉네임 또는 이메일로 대화 상대를 찾습니다.</p>
                    </div>
                    <div class="search-bar">
                        <input type="text" id="userSearchInput" class="search-input" placeholder="예: tester 또는 user@example.com">
                        <button type="button" id="btnUserSearch" class="action-button">검색</button>
                    </div>
                    <div id="searchResults" class="search-results">
                        <div class="empty-state">검색 결과가 여기에 표시됩니다.</div>
                    </div>
                </section>

                <section class="messages-panel">
                    <div class="panel-header">
                        <h2>대화 목록</h2>
                        <p>최근 1:1 메시지 기준으로 정렬됩니다.</p>
                    </div>
                    <div id="conversationList" class="conversation-list">
                        <div class="loading">대화 목록을 불러오는 중...</div>
                    </div>
                </section>
            </aside>

            <section class="messages-content messages-panel">
                <div class="chat-header">
                    <div class="chat-partner">
                        <img id="chatPartnerImage" src="/images/default-profile.png" alt="대화 상대" class="chat-avatar">
                        <div>
                            <div id="chatPartnerName" class="chat-name">대화 상대를 선택하세요</div>
                            <div id="chatPartnerMeta" class="chat-meta">검색 또는 대화 목록에서 시작할 수 있습니다.</div>
                        </div>
                    </div>
                </div>

                <div id="messageList" class="message-list">
                    <div class="empty-state">대화 상대를 선택하면 메시지가 표시됩니다.</div>
                </div>

                <form id="messageForm" class="message-form">
                    <textarea id="messageInput" class="message-input" rows="3" placeholder="메시지를 입력해 주세요" disabled></textarea>
                    <div class="message-form-footer">
                        <span id="messageHelper" class="message-helper">대화 상대를 먼저 선택하세요.</span>
                        <button type="submit" id="btnSendMessage" class="action-button" disabled>전송</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <script src="/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/messages.js"></script>
</body>

</html>
