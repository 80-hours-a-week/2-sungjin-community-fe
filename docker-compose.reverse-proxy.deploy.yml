services:
  mysql:
    image: mysql:8.4
    container_name: community-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: community
      MYSQL_USER: community
      MYSQL_PASSWORD: community1234
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"

  backend:
    image: ${DOCKERHUB_USER}/community-backend:${TAG}
    container_name: community-backend
    environment:
      DATABASE_URL: mysql+pymysql://community:community1234@mysql:3306/community
      CORS_ALLOW_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:3001,http://127.0.0.1:3001
    command: >
      /bin/sh -c "until python -c 'import pymysql; c=pymysql.connect(host=\"mysql\", user=\"community\", password=\"community1234\", database=\"community\", port=3306); c.close()'; do echo 'Waiting for MySQL...'; sleep 3; done; mkdir -p /app/uploads && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8000"

  frontend:
    image: ${DOCKERHUB_USER}/community-frontend:${TAG}
    container_name: community-frontend
    environment:
      PORT: 3001
      API_URL: /api
      FILE_UPLOAD_API_URL: ${FILE_UPLOAD_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3001"

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: community-reverse-proxy
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./ops/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
