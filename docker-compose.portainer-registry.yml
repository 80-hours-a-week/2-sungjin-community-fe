services:
  registry:
    image: registry:2
    container_name: community-private-registry
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Community Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - registry_data:/var/lib/registry
      - ./ops/registry/auth:/auth:ro
    ports:
      - "5000:5000"

  portainer:
    image: portainer/portainer-ce:2.27.6
    container_name: community-portainer
    restart: unless-stopped
    command:
      - -H
      - unix:///var/run/docker.sock
    expose:
      - "9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    depends_on:
      - registry

  portainer-proxy:
    image: nginx:1.27-alpine
    container_name: community-portainer-proxy
    restart: unless-stopped
    depends_on:
      - portainer
    ports:
      - "9443:9443"
    volumes:
      - ./ops/portainer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/portainer/certs:/etc/nginx/certs:ro

volumes:
  registry_data:
  portainer_data:
