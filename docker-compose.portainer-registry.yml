services:
  registry:
    image: registry:2
    container_name: community-private-registry
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry
    ports:
      - "5000:5000"

  portainer:
    image: portainer/portainer-ce:2.27.6
    container_name: community-portainer
    restart: unless-stopped
    command:
      - --http-disabled
      - -H
      - unix:///var/run/docker.sock
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    depends_on:
      - registry

volumes:
  registry_data:
  portainer_data:
