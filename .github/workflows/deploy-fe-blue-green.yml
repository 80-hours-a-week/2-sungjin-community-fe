name: Deploy Frontend Blue Green To EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail
          cat > ec2_key.pem <<'KEY'
          ${{ secrets.FE_BLUEGREEN_EC2_SSH_PRIVATE_KEY }}
          KEY
          chmod 600 ec2_key.pem

      - name: Deploy FE blue/green
        shell: bash
        env:
          EC2_HOST: ${{ secrets.FE_BLUEGREEN_EC2_HOST }}
          EC2_USER: ${{ secrets.FE_BLUEGREEN_EC2_USER }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          API_URL: ${{ secrets.FE_BLUEGREEN_API_URL }}
          FILE_UPLOAD_API_URL: ${{ secrets.FE_BLUEGREEN_FILE_UPLOAD_API_URL }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/ec2-bluegreen-fe-deploy.sh
          API_URL="$API_URL" FILE_UPLOAD_API_URL="$FILE_UPLOAD_API_URL" \
            ./scripts/ec2-bluegreen-fe-deploy.sh "$EC2_HOST" "$EC2_USER" "$DOCKERHUB_USER" "$IMAGE_TAG" ./ec2_key.pem
