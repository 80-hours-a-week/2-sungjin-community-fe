services:
  backend:
    build:
      context: ../2-sungjin-community-be
      dockerfile: Dockerfile
    image: sungjin9288/community-backend:local
    container_name: community-backend
    command: >
      /bin/sh -c "mkdir -p /app/data && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: sqlite:///./data/community.db
      CORS_ALLOW_ORIGINS: http://localhost:3001,http://frontend:3001
      PYTHONUNBUFFERED: "1"
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: sungjin9288/community-frontend:local
    container_name: community-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: "3001"
      API_URL: http://backend:8000
      FILE_UPLOAD_API_URL: ""
      NODE_ENV: production
    ports:
      - "3001:3001"

volumes:
  backend_data:
